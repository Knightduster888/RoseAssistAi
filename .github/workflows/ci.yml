name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: archive self-test + syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all source (syntax gate)
        run: |
          python3 -m compileall -q shared_viewer.py archive.py presence.py \
            recall_cli.py realtime_trigger.py rose_corey_watch.py \
            tests/test_archive.py
          echo "compileall OK"

      - name: Run archive unit tests (hermetic)
        run: |
          python3 -W error::ResourceWarning -m unittest discover -s tests -v
